name: Daily Horizon Summary

on:
  schedule:
    # GitHub 的 schedule 触发普遍比设定时间晚（本仓库 144 次运行实测：中位数 +4.3 小时，
    # 最快 +1.4 小时，最慢 +11 小时），所以这里不直接定在目标时间，而是提前触发
    # （UTC 18:00 = 北京 02:00），再由下一步等到 UTC 00:20（北京 08:20）开始抓取。
    - cron: '0 18 * * *'
  workflow_dispatch:      # Allow manual trigger
    inputs:
      skip_wait:
        description: "立即执行（不等到北京 08:20 的发布窗口）"
        type: boolean
        default: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    # 等待窗口最多 5h30m，加上抓取与部署仍要留在 GitHub 单任务 6 小时的上限内
    timeout-minutes: 355
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for publish window (北京 08:20 / UTC 00:20)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_wait }}
        run: python3 scripts/wait_for_window.py

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your config.json provider settings
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
        run: uv run horizon --hours 48

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
